<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sorting Algorithm Web App logo">
  <style>
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: sort 1.8s ease-in-out infinite alternate; }
    .bar:nth-child(2) { animation-delay: 140ms; }
    .bar:nth-child(3) { animation-delay: 280ms; }
    .bar:nth-child(4) { animation-delay: 420ms; }
    @keyframes sort { from { transform: scaleY(.72); opacity: .7; } to { transform: scaleY(1); opacity: 1; } }
  </style>
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect class="bar" x="12" y="34" width="8" height="18" rx="2" fill="#6366f1"/>
  <rect class="bar" x="24" y="25" width="8" height="27" rx="2" fill="#22c55e"/>
  <rect class="bar" x="36" y="16" width="8" height="36" rx="2" fill="#f59e0b"/>
  <rect class="bar" x="48" y="9" width="5" height="43" rx="2" fill="#f43f5e"/>
</svg>
