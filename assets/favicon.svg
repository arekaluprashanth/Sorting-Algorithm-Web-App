<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sorting Algorithm Web App logo">
  <style>
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: sort 1.2s ease-in-out infinite alternate; }
    .bar:nth-child(2) { animation-delay: 120ms; }
    .bar:nth-child(3) { animation-delay: 240ms; }
    @keyframes sort { from { transform: scaleY(.68); opacity: .72; } to { transform: scaleY(1); opacity: 1; } }
  </style>
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <rect class="bar" x="12" y="40" width="10" height="12" rx="3" fill="#38bdf8"/>
  <rect class="bar" x="27" y="31" width="10" height="21" rx="3" fill="#34d399"/>
  <rect class="bar" x="42" y="20" width="10" height="32" rx="3" fill="#fbbf24"/>
  <path d="M12 53h40M43 13h9l-4 4" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
